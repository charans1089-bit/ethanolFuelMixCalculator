      <stop offset="0%" stop-color="#080a11"/>
      <stop offset="50%" stop-color="#0a1524"/>
      <stop offset="100%" stop-color="#071b1e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="533" fill="url(#bgT)"/>

  <!-- Gauge Arc -->
  <circle cx="400" cy="240" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="16"/>
  <path d="M260,240 A140,140 0 1,1 540,240" fill="none" stroke="#ccff00" stroke-width="16" stroke-dasharray="440 200"/>

  <!-- Digital Readout -->
