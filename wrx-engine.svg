<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a11"/>
      <stop offset="50%" stop-color="#0d111e"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccff00"/>
      <stop offset="100%" stop-color="#5eb8ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="533" fill="url(#bg)"/>
  
  <!-- Carbon texture lines -->
  <path d="M0,0 L800,533 M-200,0 L800,733 M0,-200 L1000,533" stroke="rgba(255,255,255,0.03)" stroke-width="20"/>
  
  <!-- Technical Grid -->
  <g stroke="rgba(94,184,255,0.12)" stroke-width="1">
    <line x1="40" y1="40" x2="760" y2="40"/>
    <line x1="40" y1="493" x2="760" y2="493"/>
    <line x1="40" y1="40" x2="40" y2="493"/>
    <line x1="760" y1="40" x2="760" y2="493"/>
    <line x1="400" y1="40" x2="400" y2="493" stroke-dasharray="4,4"/>
  </g>

  <!-- FA24 Engine Schematic Art -->
  <g transform="translate(250, 110)">
    <!-- Boxer Cylinders horizontally opposed -->
    <rect x="25" y="80" width="110" height="130" rx="8" fill="#141a2a" stroke="#5eb8ff" stroke-width="2"/>
    <rect x="165" y="80" width="110" height="130" rx="8" fill="#141a2a" stroke="#5eb8ff" stroke-width="2"/>
    <circle cx="80" cy="145" r="35" fill="none" stroke="#ccff00" stroke-width="3"/>
    <circle cx="220" cy="145" r="35" fill="none" stroke="#ccff00" stroke-width="3"/>
    
    <!-- Top-mount Intercooler & Turbo -->
    <path d="M60,30 L240,30 L220,70 L80,70 Z" fill="rgba(204,255,0,0.15)" stroke="#ccff00" stroke-width="2"/>
    <text x="150" y="54" font-family="monospace" font-size="12" fill="#ccff00" text-anchor="middle" font-weight="bold">TOP-MOUNT INTERCOOLER</text>
    
    <!-- Twin-Scroll Turbo Turbine -->
    <circle cx="150" cy="245" r="28" fill="#080a11" stroke="#f5c842" stroke-width="3"/>
    <path d="M150,225 L150,265 M130,245 L170,245 M136,231 L164,259 M136,259 L164,231" stroke="#f5c842" stroke-width="2"/>
  </g>

  <!-- Spec Badges & Labels -->
  <text x="70" y="100" font-family="'Orbitron', sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="2">FA24 2.4L DIT</text>
  <text x="70" y="130" font-family="'Share Tech Mono', monospace" font-size="16" fill="#ccff00" letter-spacing="1">SUBARU BOXER TURBOCHARGED ENGINE</text>

  <g transform="translate(70, 360)">
    <rect x="0" y="0" width="190" height="90" rx="6" fill="rgba(13,17,30,0.8)" stroke="rgba(255,255,255,0.1)"/>
    <text x="15" y="30" font-family="monospace" font-size="11" fill="#8892b0">DISPLACEMENT</text>
    <text x="15" y="62" font-family="'Orbitron', sans-serif" font-size="22" font-weight="800" fill="#ffffff">2,387 cc</text>

    <rect x="210" y="0" width="200" height="90" rx="6" fill="rgba(13,17,30,0.8)" stroke="rgba(255,255,255,0.1)"/>
    <text x="225" y="30" font-family="monospace" font-size="11" fill="#8892b0">BOOST PRESSURE</text>
    <text x="225" y="62" font-family="'Orbitron', sans-serif" font-size="22" font-weight="800" fill="#5eb8ff">15.5–19 PSI</text>

    <rect x="430" y="0" width="220" height="90" rx="6" fill="rgba(13,17,30,0.8)" stroke="rgba(255,255,255,0.1)"/>
    <text x="445" y="30" font-family="monospace" font-size="11" fill="#8892b0">INJECTION SYSTEM</text>
    <text x="445" y="62" font-family="'Orbitron', sans-serif" font-size="22" font-weight="800" fill="#f5c842">DIRECT (DIT)</text>
  </g>
</svg>