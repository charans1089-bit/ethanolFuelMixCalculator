name: SCRK — CI Quality Gate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Quality Gate ──────────────────────────────────────────────────
  quality:
    name: Quality Gate — TypeScript, CSS, JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (Vite + TypeScript)
        run: npm ci

      - name: TypeScript check — src/types.ts + vite.config.ts
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Vite build — bundle all pages to dist/
        run: npm run build -- --mode production 2>&1 | head -80
        continue-on-error: true

      - name: JS syntax check — core engine files
        run: |
          node --check app.js     && echo "✓ app.js"
          node --check blend-planner.js && echo "✓ blend-planner.js"
          node --check blend-planner-export.js && echo "✓ blend-planner-export.js"

      - name: CSS brace-balance check
        run: |
          python3 -c "
          import sys
          files = ['styles.css','blend-planner-styles.css','docs-styles.css']
          ok = True
          for f in files:
              t = open(f).read()
              o, c = t.count('{'), t.count('}')
              if o != c:
                  print(f'::error file={f}::Brace mismatch {o} open / {c} close')
                  ok = False
              else:
                  print(f'  ✓  {f}: {o} balanced rules')
          sys.exit(0 if ok else 1)
          "

      - name: LocalStorage key audit
        run: |
          python3 -c "
          import re, json
          with open('app.js') as f:
              code = f.read()
          keys = sorted(set(re.findall(r\"localStorage\\.(?:getItem|setItem|removeItem|key)\('([^']+)'\)\", code)))
          print('LocalStorage keys in use:')
          for k in keys:
              print(f'  {k}')
          print(f'Total: {len(keys)} unique keys')
          "

      - name: Security — scan for noopener compliance
        run: |
          python3 -c "
          import re, sys
          ok = True
          for page in ['index.html','blend-planner.html','docs.html']:
              txt = open(page).read()
              bad = re.findall(r'target=[\"_blank]+[\"]\s*(?!.*rel=.*noopener)', txt)
              if bad:
                  print(f'::warning file={page}::Found target=_blank without noopener')
                  ok = False
              else:
                  print(f'  ✓  {page}: external link safety OK')
          "

  # ─── Deploy to GitHub Pages ────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node 22 for build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Upload full repo as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the full repo root (not dist/) since scripts reference local assets
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
