<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533">
  <defs>
    <linearGradient id="bgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a11"/>
      <stop offset="50%" stop-color="#120c1a"/>
      <stop offset="100%" stop-color="#1a1026"/>
    </linearGradient>
  </defs>
  <rect width="800" height="533" fill="url(#bgR)"/>

  <!-- Aero Lines -->
  <path d="M0,260 Q400,180 800,260 M0,300 Q400,220 800,300" fill="none" stroke="rgba(255,69,69,0.2)" stroke-width="3"/>

  <!-- Rear Diffuser & Quad Tips Graphic -->
  <g transform="translate(180, 140)">
    <!-- Diffuser Fins -->
    <rect x="80" y="160" width="280" height="80" rx="10" fill="#0c0e18" stroke="#ff4545" stroke-width="2"/>
    <line x1="130" y1="160" x2="130" y2="240" stroke="#ff4545" stroke-width="4"/>
    <line x1="180" y1="160" x2="180" y2="240" stroke="#ff4545" stroke-width="4"/>
    <line x1="260" y1="160" x2="260" y2="240" stroke="#ff4545" stroke-width="4"/>
    <line x1="310" y1="160" x2="310" y2="240" stroke="#ff4545" stroke-width="4"/>
    
    <!-- Quad Exhaust Tips -->
    <circle cx="30" cy="200" r="24" fill="#1b2035" stroke="#ccff00" stroke-width="4"/>
    <circle cx="30" cy="200" r="15" fill="#080a11"/>
    
    <circle cx="78" cy="200" r="24" fill="#1b2035" stroke="#ccff00" stroke-width="4"/>
    <circle cx="78" cy="200" r="15" fill="#080a11"/>

    <circle cx="362" cy="200" r="24" fill="#1b2035" stroke="#ccff00" stroke-width="4"/>
    <circle cx="362" cy="200" r="15" fill="#080a11"/>

    <circle cx="410" cy="200" r="24" fill="#1b2035" stroke="#ccff00" stroke-width="4"/>
    <circle cx="410" cy="200" r="15" fill="#080a11"/>
  </g>

  <!-- Typography -->
  <text x="70" y="90" font-family="'Orbitron', sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="2">QUAD EXHAUST &amp; DIFFUSER</text>
  <text x="70" y="120" font-family="'Share Tech Mono', monospace" font-size="16" fill="#ff4545" letter-spacing="1">FUNCTIONAL AERO &amp; TITANIUM CATBACK</text>

  <g transform="translate(70, 390)">
    <text x="0" y="30" font-family="'Share Tech Mono', monospace" font-size="14" fill="#ccff00">▸ 3.0" STAINLESS / TITANIUM HIGH-FLOW EXHAUST</text>
    <text x="0" y="55" font-family="'Share Tech Mono', monospace" font-size="14" fill="#8892b0">▸ UNDERBODY VORTEX GENERATORS &amp; REAR SPOILER AERO</text>
  </g>
</svg>